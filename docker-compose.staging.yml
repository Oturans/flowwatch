# docker-compose.staging.yml
# FlowWatch — Staging environment profile
#
# Usage:
#   docker compose -f docker-compose.staging.yml --profile staging up -d
#   docker compose -f docker-compose.staging.yml config   # validate
#
# Differences from docker-compose.yml (dev):
#   - Named volumes for postgres & redis (data persists across restarts)
#   - API runs uvicorn with multiple workers (no --reload)
#   - Dashboard points NEXT_PUBLIC_API_URL at the staging URL
#   - Logging rotated to JSON files
#   - All services labelled as "staging"

name: flowwatch-staging

x-staging-labels: &staging-labels
  com.flowwatch.env: staging
  com.flowwatch.profile: staging
  com.flowwatch.managed-by: docker-compose

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: flowwatch/api:staging
    container_name: flowwatch-staging-api
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # No --reload, multi-worker uvicorn for production-like behavior
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
      --no-access-log
    environment:
      - DATABASE_URL=postgresql+asyncpg://flowwatch:${POSTGRES_PASSWORD:-pw}@postgres:5432/flowwatch
      - DATABASE_URL_SYNC=postgresql+psycopg2://flowwatch:${POSTGRES_PASSWORD:-pw}@postgres:5432/flowwatch
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_RATE_LIMIT_DB=2
      - REDIS_PUBSUB_DB=3
      - ENVIRONMENT=staging
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-FlowWatch alerts@staging.flowwatch.app}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    env_file:
      - ./api/.env
    # NO bind-mount of source — production-style
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: flowwatch/api:staging
    container_name: flowwatch-staging-worker
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: worker
    command: celery -A app.celery_app worker -l info -c 2 -Q webhook,retry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://flowwatch:${POSTGRES_PASSWORD:-pw}@postgres:5432/flowwatch
      - DATABASE_URL_SYNC=postgresql+psycopg2://flowwatch:${POSTGRES_PASSWORD:-pw}@postgres:5432/flowwatch
      - REDIS_BROKER=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=staging
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-FlowWatch alerts@staging.flowwatch.app}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    env_file:
      - ./api/.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 10 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: flowwatch/api:staging
    container_name: flowwatch-staging-beat
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: beat
    command: celery -A app.celery_app beat -l info
    depends_on:
      redis:
        condition: service_started
    environment:
      - REDIS_BROKER=redis://redis:6379/0
      - ENVIRONMENT=staging
    env_file:
      - ./api/.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 10 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: flowwatch-staging-postgres
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: postgres
    environment:
      - POSTGRES_DB=flowwatch
      - POSTGRES_USER=flowwatch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pw}
      - POSTGRES_HOST_AUTH_METHOD=trust
    # Don't expose postgres port to host in staging — internal only
    expose:
      - "5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./api/alembic/versions:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: flowwatch-staging-redis
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 300 100
      --save 60 1000
    # Internal only in staging
    expose:
      - "6379"
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: flowwatch/dashboard:staging
    container_name: flowwatch-staging-dashboard
    restart: unless-stopped
    labels:
      <<: *staging-labels
      com.flowwatch.service: dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      # NEXT_PUBLIC_* is baked at build time — staging URL
      - NEXT_PUBLIC_API_URL=${STAGING_API_URL:-https://api.staging.flowwatch.app}
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=staging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  staging_pgdata:
    name: flowwatch_staging_pgdata
  staging_redisdata:
    name: flowwatch_staging_redisdata